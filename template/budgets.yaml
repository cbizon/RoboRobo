# Human-only. After editing: `program approve`. The rules are the fields
# below (schema: budgets.schema.json); comments give reasons, never rules.
#
# Each resource, named as experiments name it in cost_estimate / cost_actual,
# has a list of limits:
#   max or min  never more / never less than this (min only per instant)
#   per         instant, run, week or program (week and program are summed
#               from the ledger by `program check`)
#   where       where it applies: local (the computer sessions run on) or a
#               host in program.toml [hosts]; a limit per week or program
#               must name every place
budgets:
  # cpu_hours:
  #   - {max: 200, per: week, where: [local]}
  #   - {max: 20, per: run, where: [local]}
  # cores:
  #   - {max: 8, per: instant, where: [local]}
  # disk_free_gb:
  #   - {min: 40, per: instant, where: [local]}
