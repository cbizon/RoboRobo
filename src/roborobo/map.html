<title>{{name}} program map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Written by `program map` from the program's records; don't edit. */
/* Layout: lines of investigation against nights on top; the selected line's card below. */
:root {
  --bg: #f3f6f8; --surface: #ffffff; --sunk: #e9eef2; --fg: #16212b; --muted: #586674; --line: #d3dbe2;
  --accent: #1d5f8a; --accent-soft: #dcebf5;
  --good: #2b7a58; --good-soft: #d9efe5; --warn: #a86a12; --warn-soft: #f6e7c8; --bad: #b03f38; --bad-soft: #f6dcd9;
  --idle: #8693a0; --idle-soft: #e4e9ee;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10151a; --surface: #182029; --sunk: #1f2933; --fg: #e3e9ee; --muted: #9aa8b5; --line: #2d3945;
  --accent: #74b6e0; --accent-soft: #1d3547;
  --good: #5fc59a; --good-soft: #17382c; --warn: #e2ad52; --warn-soft: #3d2f12; --bad: #e88077; --bad-soft: #452220;
  --idle: #7d8b99; --idle-soft: #26313c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #10151a; --surface: #182029; --sunk: #1f2933; --fg: #e3e9ee; --muted: #9aa8b5; --line: #2d3945;
  --accent: #74b6e0; --accent-soft: #1d3547;
  --good: #5fc59a; --good-soft: #17382c; --warn: #e2ad52; --warn-soft: #3d2f12; --bad: #e88077; --bad-soft: #452220;
  --idle: #7d8b99; --idle-soft: #26313c; color-scheme: dark }

body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1000px; margin: 0 auto; padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px; }
h1 { font-size: 24px; font-weight: 600; margin: 0; text-wrap: balance; }
h2 { font-size: 17px; font-weight: 600; margin: 0; text-wrap: balance; }
h3 { font-size: 12px; font-weight: 600; margin: 0; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
p { margin: 0; }
[hidden] { display: none !important; }
.sub { color: var(--muted); max-width: 68ch; }
.note { font-size: 13px; color: var(--muted); max-width: 72ch; }
header { display: flex; flex-direction: column; gap: 6px; }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tabs button { font: inherit; font-weight: 500; color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent;
  padding: 8px 12px; cursor: pointer; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs button:hover { color: var(--fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
section.view { display: flex; flex-direction: column; gap: 20px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.panel-head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
.panel-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }

.asks { display: flex; flex-direction: column; }
.ask { display: grid; grid-template-columns: 132px 1fr; gap: 4px 14px; padding: 12px 16px; border-top: 1px solid var(--line); }
.ask:first-child { border-top: 0; }
.ask > div { min-width: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.ask q { quotes: "\201C" "\201D"; font-weight: 500; }
.ask .extra { font-size: 13px; color: var(--muted); }
@media (max-width: 560px) { .ask { grid-template-columns: 1fr; } }

.pill { display: inline-block; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 10px; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.idle { background: var(--idle-soft); color: var(--muted); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }

.scroll { overflow-x: auto; }
svg.map { display: block; width: 100%; height: auto; font-family: var(--sans); }
svg.map text { fill: var(--fg); font-size: 12.5px; }
svg.map .dim { fill: var(--muted); font-size: 11px; }
svg.map .date { font-weight: 600; font-size: 12px; }
svg.map .colrule { stroke: var(--line); stroke-width: 1; }
svg.map .rowbg { fill: transparent; }
svg.map .lane { cursor: pointer; }
svg.map .lane:hover .rowbg { fill: var(--sunk); }
svg.map .lane.sel .rowbg { fill: var(--accent-soft); }
svg.map .lane.sel .name { font-weight: 600; }
svg.map .lane:focus-visible .rowbg { stroke: var(--accent); stroke-width: 2; }
svg.map .lane:focus { outline: none; }
svg.map .bar { fill: var(--idle-soft); }
svg.map .bar.active { fill: var(--accent-soft); }
svg.map .conn { fill: none; stroke: var(--idle); stroke-width: 1.5; }
svg.map .cap { font-size: 11px; fill: var(--muted); }
svg.map .cap.active { fill: var(--accent); font-weight: 600; }
svg.map .run.ok rect { fill: var(--good-soft); } svg.map .run.ok text { fill: var(--good); }
svg.map .run.warn rect { fill: var(--warn-soft); } svg.map .run.warn text { fill: var(--warn); }
svg.map .run.bad rect { fill: var(--bad-soft); } svg.map .run.bad text { fill: var(--bad); }
svg.map .run.none rect { fill: var(--idle-soft); } svg.map .run.none text { fill: var(--muted); }
svg.map .run text { font-size: 10px; font-weight: 500; }
.m-holds { fill: var(--good); stroke: var(--good); }
.m-doubtful { fill: var(--warn); stroke: var(--warn); }
.m-broken { fill: var(--bad); stroke: var(--bad); }
.m-unreviewed { fill: var(--idle); stroke: var(--idle); }
.m-waiting { fill: var(--surface); stroke: var(--warn); }
.m-planned { fill: var(--surface); stroke: var(--accent); stroke-dasharray: 2.5 2; }
.m-decided { fill: var(--surface); stroke: var(--idle); }
svg.map .mark { stroke-width: 2; }
svg.map .mark.cur { stroke: var(--fg); stroke-width: 2.5; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { width: 14px; height: 14px; }
.legend svg circle { stroke-width: 2; }

.card-top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--muted); }
.linkbtn { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
blockquote { margin: 0; padding: 2px 0 2px 12px; border-left: 3px solid var(--line); max-width: 68ch; }
blockquote .src { display: block; font-size: 12.5px; color: var(--muted); }
.state { max-width: 68ch; }
.hist { display: flex; flex-direction: column; }
.night { display: grid; grid-template-columns: 76px 1fr; gap: 4px 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.night > div { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.night.cur { background: var(--sunk); margin: 0 -16px; padding: 12px 16px; }
.night .when { font-weight: 600; }
.night .what { max-width: 66ch; }
.night .who { font-size: 12.5px; color: var(--muted); }
@media (max-width: 560px) { .night { grid-template-columns: 1fr; } }
.exps { display: flex; flex-direction: column; gap: 4px; }
.exp { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; font-size: 13.5px; }
.exp .id { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.exp .hyp { font-size: 12px; color: var(--muted); }
ul.arts { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
ul.arts li { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 13.5px; }
ul.arts .kind { color: var(--muted); min-width: 92px; }
ul.arts code { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }

.term { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: help;
  text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }
#pop { position: fixed; z-index: 20; max-width: 300px; background: var(--fg); color: var(--bg); padding: 8px 10px; border-radius: 6px;
  font-size: 13px; line-height: 1.4; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
#pop b { display: block; }
dl.gloss { margin: 0; display: grid; grid-template-columns: minmax(120px, 200px) 1fr; gap: 0; }
dl.gloss dt, dl.gloss dd { margin: 0; padding: 8px 0; border-top: 1px solid var(--line); }
dl.gloss dt { font-weight: 600; padding-right: 14px; }
dl.gloss dd { max-width: 62ch; }
@media (max-width: 560px) { dl.gloss { grid-template-columns: 1fr; } dl.gloss dd { border-top: 0; padding-top: 0; } }
</style>

<div class="wrap">
  <header>
    <h1>{{name}} program map</h1>
    <p class="sub" id="sub"></p>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-lines" aria-selected="true" data-view="lines">Lines</button>
    <button role="tab" id="tab-glossary" aria-selected="false" data-view="glossary">Glossary</button>
  </div>

  <section class="view" id="view-lines">
    <div class="panel" id="asks-panel" hidden>
      <div class="panel-head"><h2 id="asks-title"></h2></div>
      <div class="asks" id="asks"></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Lines of investigation</h2><span class="note" id="map-note">Select a line or a mark to open it below.</span></div>
      <div class="panel-body">
        <div class="scroll" id="map"></div>
        <div class="legend" id="legend"></div>
        <p class="note" id="unassigned" hidden></p>
      </div>
    </div>

    <div class="panel" id="card"></div>
  </section>

  <section class="view" id="view-glossary" hidden>
    <div class="panel">
      <div class="panel-head"><h2>Glossary</h2><span class="note">Dotted terms anywhere on the page open these definitions.</span></div>
      <div class="panel-body"><dl class="gloss" id="gloss"></dl></div>
    </div>
  </section>
</div>
<div id="pop" hidden></div>

<script>
const DATA = /*DATA*/null;
const LINES = DATA.lines, E = DATA.exps, TERMS = DATA.terms;
const NIGHTS = DATA.nights.slice(-(DATA.mapNights || 14));
const allNights = Object.fromEntries(DATA.nights.map(n => [n.d, n]));
const STATUS = { active: ["accent", "Active"], closed: ["idle", "Closed"], dropped: ["idle", "Dropped"], paused: ["warn", "Paused"] };
const KIND = { holds: "Checker: holds", doubtful: "Checker: doubtful", broken: "Checker: broken", unreviewed: "Work, not reviewed",
  waiting: "Waiting on " + DATA.scientist, planned: "Planned", decided: DATA.scientist + "'s decision" };
const KIND_PILL = { holds: "good", doubtful: "warn", broken: "bad", waiting: "warn", planned: "accent", unreviewed: "idle", decided: "idle" };
const ASK = { answered: ["good", "Answered"], partly: ["warn", "Partly answered"], not_answered: ["bad", "Not answered"] };
const CHECKED = { answered: "answered", partly: "partly answered", not_answered: "not answered", different_question: "a different question was answered" };
const byId = Object.fromEntries(LINES.map(l => [l.id, l]));

function firstPick() {
  for (let i = DATA.nights.length - 1; i >= 0; i--) {
    const d = DATA.nights[i].d, hit = LINES.find(l => l.nights[d] && l.nights[d].k !== "planned");
    if (hit) return { line: hit.id, night: d };
  }
  return { line: LINES.length ? LINES[0].id : null, night: null };
}
let sel = firstPick();

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const alias = {};
TERMS.forEach((t, i) => [t.term, ...t.aliases].forEach(w => alias[w.toLowerCase()] = i));
const words = Object.keys(alias).sort((a, b) => b.length - a.length).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
const termRe = words.length ? new RegExp("(?<![\\w-])(" + words.join("|") + ")(?![\\w])", "gi") : null;
const link = s => termRe ? esc(s).replace(termRe, m => `<button type="button" class="term" data-g="${alias[m.toLowerCase()]}">${m}</button>`) : esc(s);
const nightLabel = d => allNights[d] ? allNights[d].label : d;
const lineBtn = id => `<button type="button" class="linkbtn" data-goto="${id}">${esc(byId[id].name)}</button>`;

function renderAsks() {
  if (!DATA.asks) return;
  document.getElementById("asks-panel").hidden = false;
  document.getElementById("asks-title").textContent = "What you asked for the night of " + DATA.asks.night;
  document.getElementById("asks").innerHTML = DATA.asks.items.map(a => {
    const st = ASK[a.status];
    return `<div class="ask"><div><span class="pill ${st[0]}">${st[1]}</span></div>
      <div><q>${esc(a.q)}</q><span>${link(a.a)}</span>
      ${a.departures ? `<span class="extra">Done differently: ${link(a.departures)}</span>` : ""}
      ${a.verdict ? `<span class="extra">Checker: ${CHECKED[a.verdict]}. ${link(a.finding)}</span>` : ""}</div></div>`;
  }).join("");
}

function renderMap() {
  const LW = 232, CW = 62, HH = 62, RH = 34, W = LW + NIGHTS.length * CW + 200, H = HH + LINES.length * RH + 8;
  const cx = i => LW + i * CW + CW / 2, ix = d => NIGHTS.findIndex(n => n.d === d), cy = r => HH + r * RH + RH / 2;
  let s = `<svg class="map" style="min-width:${W}px" viewBox="0 0 ${W} ${H}" role="group" aria-label="Lines of investigation by night">`;
  NIGHTS.forEach((n, i) => {
    s += `<line class="colrule" x1="${cx(i) - CW / 2}" y1="6" x2="${cx(i) - CW / 2}" y2="${H - 4}"/>`;
    s += `<g><title>${esc(n.label + (n.tip ? ": " + n.tip : ""))}</title><text class="date" x="${cx(i)}" y="18" text-anchor="middle">${n.label}</text>`;
    s += `<g class="run ${n.run}"><rect x="${cx(i) - 29}" y="25" width="58" height="16" rx="8"/><text x="${cx(i)}" y="36.5" text-anchor="middle">${esc(n.runText)}</text></g>`;
    if (n.fallback) s += `<text class="dim" x="${cx(i)}" y="54" text-anchor="middle">fallback</text>`;
    s += `</g>`;
  });
  s += `<text class="dim" x="8" y="36.5">How the night ran</text>`;
  LINES.forEach((l, r) => {
    const ds = Object.keys(l.nights).filter(d => ix(d) >= 0).sort(), y = cy(r);
    const label = (l.depth ? "↳ " : "") + l.name;
    s += `<g class="lane${sel.line === l.id ? " sel" : ""}" data-line="${l.id}" tabindex="0" role="button" aria-label="${esc(l.name)}, ${STATUS[l.status][1].toLowerCase()}">`;
    s += `<rect class="rowbg" x="2" y="${y - RH / 2 + 1}" width="${W - 4}" height="${RH - 2}" rx="4"/>`;
    s += `<text class="name" x="${10 + l.depth * 14}" y="${y + 4}">${esc(label)}</text>`;
    const cap = STATUS[l.status][1].toLowerCase() + (l.feeds.length ? " → " + l.feeds.map(f => byId[f].name).join(", ") : "");
    if (ds.length) {
      const a = ix(ds[0]), b = ix(ds[ds.length - 1]);
      s += `<rect class="bar ${l.status}" x="${cx(a) - 12}" y="${y - 5}" width="${cx(b) - cx(a) + 24}" height="10" rx="5"/>`;
      ds.forEach(d => {
        const n = l.nights[d], cur = sel.line === l.id && sel.night === d;
        s += `<circle class="mark m-${n.k}${cur ? " cur" : ""}" data-night="${d}" cx="${cx(ix(d))}" cy="${y}" r="6.5"><title>${esc(nightLabel(d) + ": " + KIND[n.k])}</title></circle>`;
      });
      s += `<text class="cap ${l.status}" x="${cx(b) + 18}" y="${y + 4}">${esc(cap)}</text>`;
    } else {
      s += `<text class="cap ${l.status}" x="${LW + 8}" y="${y + 4}">${esc(cap)}</text>`;
    }
    s += `</g>`;
    const pr = l.parent ? LINES.findIndex(p => p.id === l.parent) : -1;
    if (pr >= 0 && ds.length) {
      const x0 = cx(ix(ds[0])) - 22;
      s += `<path class="conn" d="M${x0} ${cy(pr) + 5} V${y - 6} Q${x0} ${y} ${x0 + 6} ${y} H${cx(ix(ds[0])) - 12}"/>`;
    }
  });
  document.getElementById("map").innerHTML = LINES.length ? s + "</svg>" : `<p class="note">No lines of investigation are recorded yet.</p>`;
  document.getElementById("legend").innerHTML = Object.entries(KIND).map(([k, v]) =>
    `<span><svg viewBox="0 0 16 16"><circle class="m-${k}" cx="8" cy="8" r="5.5"/></svg>${esc(v)}</span>`).join("") +
    `<span>↳ branched from the line above it</span><span>→ result feeds another line</span>`;
  const un = document.getElementById("unassigned");
  un.hidden = !DATA.unassigned.length;
  un.textContent = "Experiments in no line: " + DATA.unassigned.join(", ") + ".";
}

function expRow(id) {
  const x = E[id];
  if (!x) return "";
  const pill = x.chk ? `<span class="pill ${KIND_PILL[x.chk]}">${x.chk}</span>` : "";
  const h = x.status ? (x.status === "abandoned" ? "abandoned" : "hypothesis " + x.status) : "no outcome yet";
  return `<div class="exp"><span class="id">${id}</span><span>${link(x.title)}</span>${pill}<span class="hyp">${h}</span></div>`;
}

function renderCard() {
  const card = document.getElementById("card"), l = byId[sel.line];
  if (!l) { card.hidden = true; return; }
  const st = STATUS[l.status], fed = LINES.filter(x => x.feeds.includes(l.id)), kids = LINES.filter(x => x.parent === l.id);
  let meta = `<span>Opened by ${esc(l.by)}${l.opened ? ", " + esc(nightLabel(l.opened)) : ""}</span>`;
  if (l.parent && byId[l.parent]) meta += `<span>Branched from ${lineBtn(l.parent)}</span>`;
  if (kids.length) meta += `<span>Branches: ${kids.map(k => lineBtn(k.id)).join(", ")}</span>`;
  if (l.feeds.length) meta += `<span>Feeds ${l.feeds.map(lineBtn).join(", ")}</span>`;
  if (fed.length) meta += `<span>Fed by ${fed.map(k => lineBtn(k.id)).join(", ")}</span>`;
  const hist = Object.keys(l.nights).sort().map(d => {
    const n = l.nights[d];
    return `<div class="night${sel.night === d ? " cur" : ""}"><div><span class="when">${esc(nightLabel(d))}</span></div>
      <div><div><span class="pill ${KIND_PILL[n.k]}">${esc(KIND[n.k])}</span></div>
      ${n.notes.map(t => `<p class="what">${link(t.t)} <span class="who">${esc(t.by)}</span></p>`).join("")}
      ${n.e.length ? `<div class="exps">${n.e.map(expRow).join("")}</div>` : ""}</div></div>`;
  }).join("");
  card.innerHTML = `<div class="panel-head"><div class="card-top"><h2>${esc(l.name)}</h2><span class="pill ${st[0]}">${st[1]}</span></div></div>
    <div class="panel-body">
      <div class="meta">${meta}</div>
      <div><h3>The question</h3><blockquote>${link(l.q)}${l.qsrc ? `<span class="src">${esc(l.qsrc)}</span>` : ""}</blockquote></div>
      ${l.reason ? `<div><h3>Why it was opened</h3><p class="state">${link(l.reason)}</p></div>` : ""}
      ${l.state ? `<div><h3>Where it stands</h3><p class="state">${link(l.state)}</p></div>` : ""}
      ${hist ? `<div><h3>Night by night</h3><div class="hist">${hist}</div></div>` : ""}
      ${l.other.length ? `<div><h3>Other experiments in this line</h3><div class="exps">${l.other.map(expRow).join("")}</div></div>` : ""}
      ${l.arts.length ? `<div><h3>Artifacts</h3><ul class="arts">${l.arts.map(([k, v]) => `<li><span class="kind">${esc(k)}</span><code>${esc(v)}</code></li>`).join("")}</ul></div>` : ""}
    </div>`;
}

function renderGloss() {
  document.getElementById("gloss").innerHTML = TERMS.length
    ? TERMS.map(t => `<dt>${esc(t.term)}</dt><dd>${esc(t.definition)}</dd>`).join("")
    : `<dd>No terms are recorded yet.</dd>`;
}

function select(line, night) { sel = { line, night: night || null }; renderMap(); renderCard(); }

const pop = document.getElementById("pop");
function showPop(btn) {
  const t = TERMS[+btn.dataset.g];
  pop.innerHTML = `<b>${esc(t.term)}</b>${esc(t.definition)}`;
  pop.hidden = false;
  const r = btn.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(r.left, innerWidth - pw - 8)) + "px";
  pop.style.top = (r.bottom + ph + 8 > innerHeight ? r.top - ph - 6 : r.bottom + 6) + "px";
}

function showView(v) {
  ["lines", "glossary"].forEach(k => {
    document.getElementById("view-" + k).hidden = k !== v;
    document.getElementById("tab-" + k).setAttribute("aria-selected", String(k === v));
  });
}

document.addEventListener("click", ev => {
  const t = ev.target.closest(".term");
  if (t) { showPop(t); return; }
  pop.hidden = true;
  const go = ev.target.closest("[data-goto]");
  if (go) { showView("lines"); select(go.dataset.goto); document.getElementById("card").scrollIntoView({ block: "nearest", behavior: "smooth" }); return; }
  const lane = ev.target.closest("[data-line]");
  if (lane) { const m = ev.target.closest("[data-night]"); select(lane.dataset.line, m && m.dataset.night); return; }
  const tab = ev.target.closest("[data-view]");
  if (tab) showView(tab.dataset.view);
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") pop.hidden = true;
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches && ev.target.matches("[data-line]")) {
    ev.preventDefault(); const id = ev.target.dataset.line; select(id);
    const again = document.querySelector(`[data-line="${id}"]`); if (again) again.focus();
  }
});
addEventListener("scroll", () => { pop.hidden = true; }, true);

document.getElementById("sub").textContent = DATA.title.charAt(0).toUpperCase() + DATA.title.slice(1) + ". Built from the program's records on " + DATA.generated + ".";
if (DATA.nights.length > NIGHTS.length) document.getElementById("map-note").textContent += " Showing the latest " + NIGHTS.length + " of " + DATA.nights.length + " nights; each line's card has its full history.";
renderAsks(); renderMap(); renderCard(); renderGloss();
</script>
