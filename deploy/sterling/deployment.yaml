# The always-on service. One replica only: two would both act on the same
# events. Recreate, so an update never runs two at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roborobo-service
  labels: {app.kubernetes.io/part-of: roborobo, app.kubernetes.io/component: service}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/part-of: roborobo, app.kubernetes.io/component: service}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: roborobo, app.kubernetes.io/component: service}
    spec:
      imagePullSecrets: [{name: registry-credentials}]
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 7474
        runAsGroup: 7474
        fsGroup: 7474
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: service
          # Build, push and pin the digest: see README.md.
          image: ghcr.io/cbizon/roborobo:0.2-051f764@sha256:6f54b1f69dfbb7afc3ef2850b9f929c83759f42444b012b134a8df9881d45a1f
          env:
            - {name: PROGRAMS, value: "sequel=git@github.com:cbizon/OscillationOverthruster.git"}
            - {name: ROBOROBO_URL, value: "https://github.com/cbizon/RoboRobo.git"}
            - {name: ROBOROBO_REF, value: main}
            - {name: GIT_NAME, value: "RoboRobo service"}
            - {name: GIT_EMAIL, value: "bizon@renci.org"}
            - {name: POLL_MINUTES, value: "5"}
            - {name: DASHBOARD_PORT, value: "8080"}
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom: {secretKeyRef: {name: claude-provider-credentials, key: CLAUDE_CODE_OAUTH_TOKEN}}
          ports:
            - {name: dashboard, containerPort: 8080}
          volumeMounts:
            - {name: home, mountPath: /Users/bizon}
            - {name: ssh, mountPath: /secrets/ssh, readOnly: true}
          resources:
            requests: {cpu: 500m, memory: 2Gi, ephemeral-storage: 100Mi}
            limits: {cpu: "2", memory: 6Gi, ephemeral-storage: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - {name: home, persistentVolumeClaim: {claimName: roborobo-home}}
        - {name: ssh, secret: {secretName: roborobo-ssh, defaultMode: 0440}}
