# The always-on service. One replica only: two would both act on the same
# events. Recreate, so an update never runs two at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roborobo-service
  labels: {app.kubernetes.io/part-of: roborobo, app.kubernetes.io/component: service}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/part-of: roborobo, app.kubernetes.io/component: service}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: roborobo, app.kubernetes.io/component: service}
    spec:
      imagePullSecrets: [{name: registry-credentials}]
      # The service's own account (rbac.yaml), to start agent runs as pods of
      # their own. Agent pods get no token, and no keys.
      serviceAccountName: roborobo-service
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 7474
        runAsGroup: 7474
        fsGroup: 7474
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: service
          # Build, push and pin the digest: see README.md.
          image: ghcr.io/cbizon/roborobo:0.4-c805a23@sha256:8ffff5e2ef3698fcc163fa71b4babd870b1125553b76e8ba703cdea7054ea939
          env:
            - {name: PROGRAMS, value: "sequel=git@github.com:cbizon/OscillationOverthruster.git"}
            - {name: ROBOROBO_URL, value: "https://github.com/cbizon/RoboRobo.git"}
            - {name: ROBOROBO_REF, value: main}
            - {name: GIT_NAME, value: "RoboRobo service"}
            - {name: GIT_EMAIL, value: "bizon@renci.org"}
            - {name: POLL_MINUTES, value: "5"}
            - {name: DASHBOARD_PORT, value: "8080"}
            - {name: API_PORT, value: "8081"}
            - {name: ROBOROBO_RUNNER, value: kubernetes}
            # Restart between looks when RoboRobo's branch has new commits; the
            # entrypoint updates it and the service re-syncs each program.
            - {name: ROBOROBO_SELF_UPDATE, value: "1"}
            - {name: ROBOROBO_VOLUME, value: roborobo-home}
            - {name: ROBOROBO_SERVICE_URL, value: "http://roborobo-api:8081"}
            - {name: ROBOROBO_CLAUDE_SECRET, value: roborobo-claude}
            # What the scientist pastes into the dashboard once, to act from it.
            # Without the secret the dashboard is read-only. Agent pods never get it.
            - name: ROBOROBO_DASHBOARD_TOKEN
              valueFrom: {secretKeyRef: {name: roborobo-dashboard, key: token, optional: true}}
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom: {secretKeyRef: {name: roborobo-claude, key: CLAUDE_CODE_OAUTH_TOKEN}}
          ports:
            - {name: dashboard, containerPort: 8080}
            - {name: api, containerPort: 8081}
          volumeMounts:
            - {name: home, mountPath: /Users/bizon}
            - {name: ssh, mountPath: /secrets/ssh, readOnly: true}
            - {name: keys, mountPath: /run/roborobo}
          resources:
            requests: {cpu: 500m, memory: 2Gi, ephemeral-storage: 100Mi}
            limits: {cpu: "2", memory: 6Gi, ephemeral-storage: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - {name: home, persistentVolumeClaim: {claimName: roborobo-home}}
        - {name: ssh, secret: {secretName: roborobo-ssh, defaultMode: 0440}}
        - {name: keys, emptyDir: {medium: Memory, sizeLimit: 16Mi}}
