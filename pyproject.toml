[project]
name = "roborobo"
version = "0.1.0"
description = "Run long research programs with scheduled agent sessions, an independent referee, and a human who steers"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "numpy>=2.2",
    "pyyaml>=6.0",
]

[project.scripts]
program = "roborobo.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roborobo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
